# The isolated lifecycle runner starts a minimal WirePlumber device-profile and
# device-route policy. The standard client.conf already loads client-node,
# client-device, and adapter once; this drop-in only configures adapter ports at
# creation.

stream.properties = {
    adapter.auto-port-config = {
        mode = dsp
        monitor = false
        control = false
        position = preserve
    }
}
