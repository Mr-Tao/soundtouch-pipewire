# Focused stock-policy profile for the real WirePlumber Route smoke. Link and
# default-node policy stay disabled so the C fixture owns every lifecycle edge.
wireplumber.profiles = {
  stpw-smoke = {
    inherits = [ base ]
    metadata.sm-settings = required
    metadata.sm-objects = required
    support.standard-event-source = required
    policy.device.profile = required
    policy.device.routes = required
  }
}
