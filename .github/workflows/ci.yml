name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    # Catch Arch runtime updates even when this repository has no new commits.
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Install build and test dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git ca-certificates pacman-contrib
          avahi clang gettext glib2 glib2-devel gtk4 json-glib
          libpipewire libsoup3 libxml2 meson ninja openssl opus patchelf
          pipewire pipewire-audio pipewire-pulse pkgconf rust libwireplumber
          appstream desktop-file-utils libpulse lua wireplumber
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare unprivileged builder
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Verify source and build both packages
        shell: bash
        run: |
          # shellcheck disable=SC2016 # Expanded by the builder's shell.
          runuser -u builder -- bash -euc '
            cd "$1/packaging/aur"
            ./prepare-local-source.sh
            git diff --exit-code -- PKGBUILD .SRCINFO
            ./check-release-gate.sh
            makepkg --cleanbuild --force --noconfirm --log
          ' bash "$GITHUB_WORKSPACE"
