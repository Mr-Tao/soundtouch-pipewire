# Preserve fresh v2 Route fields whenever stored Route state omits them.
wireplumber.components = [
  {
    name = soundtouch/current-route-defaults.lua, type = script/lua
    provides = hooks.device.routes.soundtouch-current-defaults
  }
]

wireplumber.components.rules = [
  {
    matches = [
      { provides = policy.device.routes }
    ]
    actions = {
      merge = {
        wants = [ hooks.device.routes.soundtouch-current-defaults ]
      }
    }
  }
]
